name: Performance tooling

on:
  push:
    paths: ["performance/**", ".github/workflows/performance-ci.yml"]
  pull_request:
    paths: ["performance/**", ".github/workflows/performance-ci.yml"]

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify metrics and load scenarios against disposable HTTP fixtures
        working-directory: performance
        run: npm run test:coverage
