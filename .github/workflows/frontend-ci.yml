name: Frontend CI

on:
  push:
  pull_request:
    branches: [develop, pre-develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage

  browser:
    name: Visitor-to-booking browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_ARTIFACT_DIR: .test-artifacts/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Locate Chrome or Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            echo "::error::Chrome/Chromium is required for the browser journey."
            exit 1
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Run isolated browser journeys
        run: npm run test:e2e
      - name: Upload browser journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visitor-booking-browser-results
          path: frontend/.test-artifacts/e2e/
          if-no-files-found: ignore
