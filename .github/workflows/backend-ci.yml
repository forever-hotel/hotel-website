name: Backend CI

on:
  push:
  pull_request:
    branches: [develop, pre-develop]

jobs:
  backend:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Lint backend
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand
